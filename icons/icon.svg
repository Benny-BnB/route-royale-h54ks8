<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e91e63"/>
      <stop offset="1" stop-color="#ff8f3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- petites etincelles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M150 220 l14 40 l40 14 l-40 14 l-14 40 l-14 -40 l-40 -14 l40 -14z"/>
    <path d="M880 180 l10 28 l28 10 l-28 10 l-10 28 l-10 -28 l-28 -10 l28 -10z"/>
    <path d="M900 800 l12 34 l34 12 l-34 12 l-12 34 l-12 -34 l-34 -12 l34 -12z"/>
    <path d="M130 780 l9 26 l26 9 l-26 9 l-9 26 l-9 -26 l-26 -9 l26 -9z"/>
  </g>

  <g stroke="#4a1235" stroke-width="24" stroke-linejoin="round" stroke-linecap="round">
    <!-- corps de la couronne -->
    <path d="M250 700 L214 370 L400 510 L512 310 L624 510 L810 370 L774 700 Z" fill="#ffd23f"/>
    <!-- bandeau -->
    <rect x="250" y="700" width="524" height="96" rx="26" fill="#ffb703"/>
    <!-- boules sur les pointes -->
    <circle cx="214" cy="352" r="38" fill="#ffffff"/>
    <circle cx="512" cy="288" r="42" fill="#ffffff"/>
    <circle cx="810" cy="352" r="38" fill="#ffffff"/>
    <!-- coeur -->
    <path d="M512 660 C420 600 408 528 455 508 C487 494 512 518 512 536 C512 518 537 494 569 508 C616 528 604 600 512 660 Z" fill="#e91e63" stroke-width="16"/>
  </g>
  <!-- reflet du coeur -->
  <path d="M458 540 C466 528 482 526 490 538" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <!-- bijoux du bandeau -->
  <g fill="#ffffff" stroke="#4a1235" stroke-width="10">
    <circle cx="340" cy="748" r="16"/>
    <circle cx="512" cy="748" r="16"/>
    <circle cx="684" cy="748" r="16"/>
  </g>
</svg>
